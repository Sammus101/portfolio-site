<!-- @dsCard group="Layout" height=380 subtitle="Hero's right-hand visual — a node graph in place of a portrait; needs no photo" -->
<div style="background:var(--bg-void); padding:var(--space-32); width:460px;">
  <svg width="420" height="340" viewBox="0 0 420 340">
    <defs>
      <linearGradient id="kg-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--gold-100)"/>
        <stop offset="1" stop-color="var(--gold-600)"/>
      </linearGradient>
    </defs>

    <circle cx="210" cy="170" r="60" fill="none" stroke="var(--border-slate)" stroke-width="1" stroke-dasharray="2 5"/>
    <circle cx="210" cy="170" r="118" fill="none" stroke="var(--border-slate)" stroke-width="1" stroke-dasharray="2 5"/>

    <g stroke="var(--border-slate)" stroke-width="1">
      <line x1="210" y1="170" x2="90" y2="70"/>
      <line x1="210" y1="170" x2="330" y2="90"/>
      <line x1="210" y1="170" x2="70" y2="250"/>
      <line x1="210" y1="170" x2="340" y2="255"/>
      <line x1="210" y1="170" x2="160" y2="40"/>
      <line x1="210" y1="170" x2="120" y2="300"/>
    </g>
    <g stroke="url(#kg-gold)" stroke-width="var(--border-fracture)" style="filter:drop-shadow(var(--shadow-fracture-glow));">
      <line x1="210" y1="170" x2="260" y2="55"/>
      <line x1="210" y1="170" x2="300" y2="230"/>
    </g>

    <g fill="var(--gold-600)">
      <circle cx="90" cy="70" r="3"/>
      <circle cx="330" cy="90" r="3"/>
      <circle cx="70" cy="250" r="3"/>
      <circle cx="340" cy="255" r="3"/>
      <circle cx="160" cy="40" r="3"/>
      <circle cx="120" cy="300" r="3"/>
      <circle cx="260" cy="55" r="4"/>
      <circle cx="300" cy="230" r="4"/>
    </g>

    <g class="label" fill="var(--text-secondary)" style="font-family:var(--font-mono); font-size:10px;">
      <text x="98" y="66">AI</text>
      <text x="264" y="50">ETHICS</text>
      <text x="338" y="86">PRODUCT</text>
      <text x="168" y="36">THEORY</text>
      <text x="78" y="254">CAPITAL</text>
      <text x="308" y="226">DATA</text>
      <text x="128" y="304">CREATIVITY</text>
      <text x="348" y="259">BUSINESS</text>
    </g>

    <text x="210" y="164" text-anchor="middle" fill="var(--text-primary)" style="font-family:var(--font-serif); font-size:14px;">Second Brain</text>
    <text x="210" y="182" text-anchor="middle" fill="var(--text-secondary)" style="font-family:var(--font-mono); font-size:10px;">KNOWLEDGE GARDEN</text>
  </svg>
</div>
