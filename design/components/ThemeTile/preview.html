<!-- @dsCard group="Cards" height=260 subtitle="Section 3 — one intellectual-territory tile, asymmetric grid" -->
<div style="background:var(--bg-void); padding:var(--space-32) var(--space-64); display:grid; grid-template-columns: 1.4fr 1fr 1fr; gap:var(--space-16); max-width:720px;">

  <div class="ds-card ds-hover-lift" style="grid-row: span 2; display:flex; flex-direction:column; justify-content:flex-end; min-height:220px; border-color:var(--gold-600); box-shadow:var(--shadow-gold-glow), var(--shadow-elevated);">
    <span class="label ds-caps" style="margin-bottom:var(--space-8);">Territory</span>
    <span class="section-header" style="font-size:28px; color:var(--text-primary);">Investing</span>
  </div>

  <div class="ds-card ds-hover-lift" style="display:flex; flex-direction:column; justify-content:flex-end; min-height:100px;">
    <span class="label ds-caps" style="margin-bottom:var(--space-8);">Territory</span>
    <span class="section-header" style="font-size:22px; color:var(--text-primary);">Technology</span>
  </div>

  <div class="ds-card ds-hover-lift" style="display:flex; flex-direction:column; justify-content:flex-end; min-height:100px;">
    <span class="label ds-caps" style="margin-bottom:var(--space-8);">Territory</span>
    <span class="section-header" style="font-size:22px; color:var(--text-primary);">Philosophy</span>
  </div>

  <div class="ds-card ds-hover-lift" style="display:flex; flex-direction:column; justify-content:flex-end; min-height:100px;">
    <span class="label ds-caps" style="margin-bottom:var(--space-8);">Territory</span>
    <span class="section-header" style="font-size:22px; color:var(--text-primary);">Science</span>
  </div>

  <div class="ds-card ds-hover-lift" style="display:flex; flex-direction:column; justify-content:flex-end; min-height:100px;">
    <span class="label ds-caps" style="margin-bottom:var(--space-8);">Territory</span>
    <span class="section-header" style="font-size:22px; color:var(--text-primary);">Business</span>
  </div>
</div>
