<!-- @dsCard group="Cards" height=260 subtitle="Section 2 — one milestone in A Life in Fragments" -->
<div style="background:var(--bg-void); padding:var(--space-32) var(--space-64); display:flex; gap:var(--space-24); align-items:flex-start;">

  <div class="ds-card ds-hover-lift" style="width:260px; clip-path:polygon(0 0, 100% 0, 100% 88%, 92% 100%, 0 100%);">
    <span class="label ds-caps">Turning Point — 01</span>
    <h3 class="section-header" style="font-size:28px; color:var(--text-primary); margin:var(--space-16) 0 var(--space-16);">The Spark</h3>
    <p class="body" style="color:var(--text-secondary); margin:0;">A short line on what changed and why it mattered, in the same restrained voice as everywhere else.</p>
  </div>

  <svg width="90" height="140" viewBox="0 0 90 140" style="margin-top:60px; overflow:visible;">
    <defs>
      <linearGradient id="ds-gold-seam-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--gold-100)"/>
        <stop offset="1" stop-color="var(--gold-600)"/>
      </linearGradient>
    </defs>
    <path class="ds-fracture-stroke" d="M0,20 C40,0 40,60 90,50"/>
  </svg>

  <div class="ds-card ds-hover-lift" style="width:260px; margin-top:30px; clip-path:polygon(0 0, 92% 0, 100% 12%, 100% 100%, 0 100%);">
    <span class="label ds-caps">Turning Point — 02</span>
    <h3 class="section-header" style="font-size:28px; color:var(--text-primary); margin:var(--space-16) 0 var(--space-16);">Building Systems</h3>
    <p class="body" style="color:var(--text-secondary); margin:0;">The next fragment, offset lower — the stagger is the timeline, not a straight rail.</p>
  </div>
</div>
