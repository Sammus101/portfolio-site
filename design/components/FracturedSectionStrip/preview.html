<!-- @dsCard group="Layout" height=300 subtitle="The footer gateway strip — one broken panel, flush shards divided by cracks (shown at 3 of 5)" -->
<div style="position:relative; background:var(--surface); width:100%; height:260px;">
  <svg width="100%" height="100%" viewBox="0 0 900 260" preserveAspectRatio="none" style="position:absolute; inset:0;">
    <defs>
      <linearGradient id="fss-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--gold-100)"/>
        <stop offset="1" stop-color="var(--gold-600)"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#fss-gold)" stroke-width="var(--border-fracture)" stroke-linecap="round" style="filter:drop-shadow(var(--shadow-fracture-glow));">

      <path d="M0,250 C10,235 26,244 40,230"/>
      <path d="M900,246 C888,232 872,240 860,226"/>
    </g>
  </svg>

  <div style="position:relative; display:flex; height:260px;">
    <div style="flex:1; padding:var(--space-24); position:relative;">
      <span class="label" style="position:absolute; top:var(--space-16); right:var(--space-16); opacity:0.55;">01</span>
      <span style="font-family:var(--font-serif); font-size:44px; color:var(--text-secondary); opacity:0.55; display:block;">01</span>
      <h3 class="section-header" style="font-size:22px; line-height:1.15; color:var(--text-primary); margin:var(--space-8) 0 0;">Resume &amp;<br/>Playbook</h3>
      <div style="position:absolute; bottom:var(--space-16); left:var(--space-24);">
        <span class="label" style="display:block; opacity:0.6;">interface</span>
        <span class="label" style="display:block; opacity:0.6;">data #01</span>
      </div>
    </div>
    <div style="flex:1; padding:var(--space-24); position:relative;">
      <span class="label" style="position:absolute; top:var(--space-16); right:var(--space-16); opacity:0.55;">02</span>
      <span style="font-family:var(--font-serif); font-size:44px; color:var(--text-secondary); opacity:0.55; display:block;">02</span>
      <h3 class="section-header" style="font-size:22px; line-height:1.15; color:var(--text-primary); margin:var(--space-8) 0 0;">Ideas &amp;<br/>Philosophy</h3>
      <div style="position:absolute; bottom:var(--space-16); left:var(--space-24);">
        <span class="label" style="display:block; opacity:0.6;">interface</span>
        <span class="label" style="display:block; opacity:0.6;">data #02</span>

    </div>

      <span style="font-family:var(--font-serif); font-size:44px; color:var(--text-secondary); opacity:0.55; display:block;">03</span>
      <h3 class="section-header" style="font-size:22px; line-height:1.15; color:var(--text-primary); margin:var(--space-8) 0 0;">The<br/>Bookshelf</h3>
      <div style="position:absolute; bottom:var(--space-16); left:var(--space-24);">
        <span class="label" style="display:block; opacity:0.6;">interface</span>
        <span class="label" style="display:block; opacity:0.6;">data #03</span>
      </div>
      <svg width="40" height="16" viewBox="0 0 40 16" style="position:absolute; bottom:var(--space-16); right:var(--space-16);">
        <polyline points="0,12 8,6 16,10 24,3 32,8 40,2" fill="none" stroke="var(--gold-600)" stroke-width="1"/>
