<!-- @dsCard group="Dashboard" height=280 subtitle="Section 4 — Right Now, live laboratory state" -->
<div class="ds-card" style="max-width:640px; margin:var(--space-32) auto;">
  <div style="display:flex; align-items:center; gap:var(--space-8); margin-bottom:var(--space-24);">
    <span class="ds-live-dot"></span>
    <span class="label ds-caps">Live Laboratory State</span>
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-24);">
    <div style="border-top:var(--border-hairline) solid var(--border-slate); padding-top:var(--space-16);">
      <span class="label ds-caps" style="color:var(--text-secondary); display:block; margin-bottom:var(--space-8);">Building</span>
      <span class="nav-link" style="color:var(--text-primary);">Project Projections</span>
    </div>
    <div style="border-top:var(--border-hairline) solid var(--border-slate); padding-top:var(--space-16);">
      <span class="label ds-caps" style="color:var(--text-secondary); display:block; margin-bottom:var(--space-8);">Reading</span>
      <span class="nav-link" style="color:var(--text-primary);">Book Title</span>
    </div>
    <div style="border-top:var(--border-hairline) solid var(--border-slate); padding-top:var(--space-16); grid-column: span 2;">
      <span class="label ds-caps" style="color:var(--text-secondary); display:block; margin-bottom:var(--space-8);">Explorations</span>
      <span class="nav-link" style="color:var(--text-primary);">Current topics, comma separated, in the same mono readout voice</span>
    </div>
  </div>
</div>
